[project]
name = "devbooks-browser-agent"
version = "0.1.0"
description = "Comparing pure Playwright, Browser Use 1.0, and hybrid CDP web-browsing agents with Gemini 3.5 Flash Lite"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "browser-use==1.0.8",
    "playwright==1.65.2",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devbooks_agent", "demo_site"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
